services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strikeshield
      POSTGRES_USER: strikeshield
      POSTGRES_PASSWORD: strikeshield
    ports:
      - "5432:5432"
    volumes:
      - strikeshield-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strikeshield -d strikeshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/StrikeShield.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=strikeshield;Username=strikeshield;Password=strikeshield"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  strikeshield-postgres-data:
